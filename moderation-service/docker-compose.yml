services:
  moderation:
    build:
      context: .
    image: strova-local-moderation:20261114
    container_name: stroika-local-moderation
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - moderation-models:/models
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45m

volumes:
  moderation-models:
